<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        body {
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }

        .calculator {
            background: #333;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 360px;
            overflow: hidden;
            padding: 1.5rem;
        }

        .display {
            background: #444;
            color: #fff;
            font-size: 2.5rem;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            text-align: right;
            min-height: 3rem;
            letter-spacing: 1px;
            overflow-x: auto;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
        }

        .btn {
            padding: 1rem;
            font-size: 1.25rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(145deg, #505050, #3f3f3f);
            color: #fff;
            cursor: pointer;
            transition: transform 0.1s ease-in-out, box-shadow 0.1s ease-in-out;
            box-shadow: 3px 3px 7px #2a2a2a, -3px -3px 7px #464646;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn:active {
            transform: translateY(1px);
            box-shadow: inset 1px 1px 3px #2a2a2a, inset -1px -1px 3px #464646;
        }

        .btn.operator {
            background: linear-gradient(145deg, #ffab40, #f08c00);
            color: #fff;
            box-shadow: 3px 3px 7px #b36e00, -3px -3px 7px #ffc766;
        }

        .btn.equal {
            background: linear-gradient(145deg, #4caf50, #2e7d32);
            color: #fff;
            grid-column: span 2;
            box-shadow: 3px 3px 7px #1b5e20, -3px -3px 7px #8bc34a;
        }

        .btn.clear {
            background: linear-gradient(145deg, #e57373, #d32f2f);
            color: #fff;
            box-shadow: 3px 3px 7px #9a0007, -3px -3px 7px #f44336;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="buttons">
            <button class="btn clear" onclick="clearDisplay()">C</button>
            <button class="btn" onclick="appendValue('(')">(</button>
            <button class="btn" onclick="appendValue(')')">)</button>
            <button class="btn operator" onclick="appendValue('/')">÷</button>
            <button class="btn" onclick="appendValue('7')">7</button>
            <button class="btn" onclick="appendValue('8')">8</button>
            <button class="btn" onclick="appendValue('9')">9</button>
            <button class="btn operator" onclick="appendValue('*')">×</button>
            <button class="btn" onclick="appendValue('4')">4</button>
            <button class="btn" onclick="appendValue('5')">5</button>
            <button class="btn" onclick="appendValue('6')">6</button>
            <button class="btn operator" onclick="appendValue('-')">−</button>
            <button class="btn" onclick="appendValue('1')">1</button>
            <button class="btn" onclick="appendValue('2')">2</button>
            <button class="btn" onclick="appendValue('3')">3</button>
            <button class="btn operator" onclick="appendValue('+')">+</button>
            <button class="btn" onclick="appendValue('0')">0</button>
            <button class="btn" onclick="appendValue('.')">.</button>
            <button class="btn equal" onclick="calculateResult()">=</button>
        </div>
    </div>
    <script>
        const display = document.getElementById('display');
        let currentInput = '0';

        function appendValue(val) {
            if (currentInput === '0' && val !== '.') {
                currentInput = val;
            } else {
                currentInput += val;
            }
            display.textContent = currentInput;
        }

        function clearDisplay() {
            currentInput = '0';
            display.textContent = currentInput;
        }

        function calculateResult() {
            try {
                let result = eval(currentInput.replace(/÷/g, '/').replace(/×/g, '*'));
                display.textContent = result;
                currentInput = result.toString();
            } catch {
                display.textContent = 'Error';
                currentInput = '0';
            }
        }
    </script>
</body>
</html>
